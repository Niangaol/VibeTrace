[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "VibeTrace"
version = "0.0.0"
description = "VibeTrace · 刻迹 — 本地 AI 编程时间与成本追踪"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests as slow",
    "win32: marks tests that require real Win32 API",
    "e2e: marks end-to-end tests",
]

[tool.coverage.run]
source = [
    "monitor", "classifier", "report", "dashboard",
    "browser_history", "inventory", "win32core", "paths",
    "applog", "tray", "insights", "updater",
    "sqlite_store", "ai_sessions", "git_insights", "timeline", "budget", "growth", "tool_compare", "adoption", "query",
    "learn", "alerts", "goals"
]
omit = [
    "tests/*",
    "*/conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
fail_under = 70
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
