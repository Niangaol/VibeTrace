name: Fast Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install coverage pytest zstandard
      - name: Run layered tests
        run: coverage run -m pytest tests/unit tests/integration tests/api tests/security tests/performance -q
        timeout-minutes: 10
      - name: Coverage report
        run: coverage report -m --fail-under=70
