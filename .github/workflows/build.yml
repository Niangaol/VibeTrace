name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install coverage pytest
      - name: Run tests with coverage (layered pytest suite)
        run: coverage run -m pytest tests/unit tests/integration tests/api tests/security tests/performance tests/e2e -q
        timeout-minutes: 10
      - name: Coverage report (gate >= 70)
        run: coverage report -m --fail-under=70
      - name: Generate coverage.xml
        run: coverage xml -o coverage.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe (VibeTrace.spec)
        run: python -m PyInstaller VibeTrace.spec --noconfirm --distpath dist --workpath build

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\VibeTrace.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VibeTrace.exe" | Set-Content -Encoding ASCII .\dist\VibeTrace.exe.sha256
          Get-Content .\dist\VibeTrace.exe.sha256

      - name: Smoke test (exe --version)
        run: .\dist\VibeTrace.exe --version

      # 版本一致性断言：tag push 时，tag 名（去掉 v 前缀）必须与 version.py 的
      # VERSION 一致（发布流程要求 version.py / tag / exe 内嵌版本三者一致）。
      # 说明：spec 为 windowed（console=False），exe 无控制台输出，CI 服务会话下
      # `exe --version` 的 stdout 不可用，故以 version.py 为事实源。
      - name: Assert version matches tag
        shell: pwsh
        run: |
          $version = (python -c "import version; print(version.VERSION)").Trim()

          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $expected = $Matches[1]
            Write-Host "trigger = tag push, expected version from tag = '$expected'"
          } else {
            $expected = $version
            Write-Host "trigger = workflow_dispatch, expected version from version.py = '$expected'"
          }

          if ($version -ne $expected) {
            Write-Error "Version mismatch: version.py reports '$version', expected '$expected'"
            exit 1
          }
          Write-Host "OK: version.py '$version' matches expected version"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTrace-windows
          path: |
            dist/VibeTrace.exe
            dist/VibeTrace.exe.sha256
            installer.ps1
            uninstaller.ps1

      - name: Extract changelog section for this tag
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = -1; $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s*\[$([regex]::Escape($ver))\]") { $start = $i; continue }
            if ($start -ge 0 -and $lines[$i] -match '^##\s*\[') { $end = $i; break }
          }
          if ($start -lt 0) {
            "section=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "No changelog section for $ver; falling back to auto notes"
          } else {
            $body = ($lines[$start..($end-1)] -join "`n").Trim()
            $delim = "CHANGELOG_EOF_$(Get-Random)"
            "section<<$delim"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $body                  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $delim                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Extracted changelog for $ver ($($end-$start) lines)"
          }

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VibeTrace.exe
            dist/VibeTrace.exe.sha256
            installer.ps1
            uninstaller.ps1
          body: ${{ steps.changelog.outputs.section }}
          generate_release_notes: true
          overwrite_files: true
